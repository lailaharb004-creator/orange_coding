<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        for ( let i=1;i<=100;i++){
            let myDiv=document.createElement("div");
            let myHead=document.createElement("h3");
            let myP=document.createElement("p");

            myDiv.className="product";

            let text1=document.createTextNode("This is Product H3");
            let text2=document.createTextNode("This is Product P");

            myHead.appendChild(text1);
            myP.appendChild(text2);

            myDiv.appendChild(myHead);
            myDiv.appendChild(myP);
           document.body.appendChild(myDiv);
        }









    </script>
    
</body>
</html>
