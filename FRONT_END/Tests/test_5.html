<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing: border-box;
        }
        body{
            height:50vh;
            width: 100%;;
            display:flex ;
            flex-direction: column;
            justify-content:space-around;
            align-items: center;
        }
        .one {
            width:25%;
            height:30vh;
            background-color: red;
        }
        ul{
            width: 20%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgb(212, 205, 205);
            list-style: none;
        }
        ul li.active,ul li:hover {
           opacity: 1;
         }
        ul li{
            width:15% ;
            height: 40px;;
            opacity: 0.1;
            transition: 0.3s;
        }
        ul li:first-child{
            
            background-color: red;

        }
        ul li:nth-child(2){
           
            background-color:green;
        }
        ul li:nth-child(3){
            
            background-color:blue;
        }
        ul li:nth-child(4){
           
            background-color:black;
        }
    </style>
</head>
<body>
    <ul>
        <li data-color="red" class="active"></li>
        <li data-color="green"></li>
        <li data-color="blue"></li>
        <li data-color="black"></li>
    </ul>
    <div class="one"></div>
    <script>
        let listItem =document.querySelectorAll("ul li");
        let myDiv=document.querySelector("div");

         if (localStorage.getItem("color")){
                   myDiv.style.backgroundColor=localStorage.getItem("color");
                   listItem.forEach( li => {
                   li.classList.remove("active");
                   document.querySelector(`[data-color="${window.localStorage.getItem("color")}"]`).classList.add("active");
               });

                }
                else{
                    console.log("not exist");
                }
        

        listItem.forEach ( li =>{
            li.addEventListener("click",(e)=>{
               console.log(e.currentTarget.dataset.color);

               listItem.forEach( li => {
                    li.classList.remove("active");
               });

               e.currentTarget.classList.add ("active");

               localStorage.setItem("color",e.currentTarget.dataset.color);
               myDiv.style.backgroundColor=localStorage.getItem("color");
              








            });
        });

        
    </script>
</body>
</html>
