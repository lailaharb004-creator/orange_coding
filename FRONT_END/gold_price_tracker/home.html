<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Assets</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .assets-page {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #bfa14b;
    }

    form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      display: grid;
      grid-gap: 10px;
    }

    form input, form select, form button {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    form button {
      background: #bfa14b;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    form button:hover {
      background: #9c841f;
    }

    .search-filter {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .search-filter input, .search-filter select {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 48%;
    }

    #assets-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .asset-card {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .asset-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .profit {
      color: green;
      font-weight: bold;
    }

    .loss {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="assets-page">
    <h1>My Assets</h1>

    <!-- Add Asset Form -->
    <form id="asset-form">
      <input type="text" id="asset-name" placeholder="Asset Name" required>
      <select id="asset-type">
        <option value="gold">Gold</option>
        <option value="jewelry">Jewelry</option>
        <option value="other">Other</option>
      </select>
      <input type="number" id="asset-quantity" placeholder="Quantity (grams)" required>
      <input type="number" id="asset-price" placeholder="Purchase Price per gram" required>
      <input type="date" id="asset-date" required>
      <button type="submit">Add Asset</button>
    </form>

    <!-- Search & Filter -->
    <div class="search-filter">
      <input type="text" id="search" placeholder="Search Assets">
      <select id="filter-type">
        <option value="all">All Types</option>
        <option value="gold">Gold</option>
        <option value="jewelry">Jewelry</option>
        <option value="other">Other</option>
      </select>
    </div>

    <!-- Assets List -->
    <div id="assets-container"></div>
  </div>

  <script>
    // Example current gold price (can integrate with Home page later)
    let currentGoldPrice = 60; // JOD per gram

    let assets = JSON.parse(localStorage.getItem("assets")) || [];

    const form = document.getElementById("asset-form");
    const container = document.getElementById("assets-container");
    const searchInput = document.getElementById("search");
    const filterSelect = document.getElementById("filter-type");

    form.addEventListener("submit", function(e) {
      e.preventDefault();

      const asset = {
        name: document.getElementById("asset-name").value,
        type: document.getElementById("asset-type").value,
        quantity: parseFloat(document.getElementById("asset-quantity").value),
        purchasePrice: parseFloat(document.getElementById("asset-price").value),
        date: document.getElementById("asset-date").value
      };

      assets.push(asset);
      localStorage.setItem("assets", JSON.stringify(assets));

      displayAssets();
      form.reset();
    });

    function displayAssets() {
      const searchValue = searchInput.value.toLowerCase();
      const filterValue = filterSelect.value;

      container.innerHTML = "";
      assets.forEach(asset => {
        if (
          (asset.name.toLowerCase().includes(searchValue) || searchValue === "") &&
          (asset.type === filterValue || filterValue === "all")
        ) {
          const currentValue = asset.type === "gold" ? asset.quantity * currentGoldPrice : asset.quantity * asset.purchasePrice;
          const profitLoss = currentValue - (asset.purchasePrice * asset.quantity);
          const div = document.createElement("div");
          div.className = "asset-card";
          div.innerHTML = `
            <h3>${asset.name}</h3>
            <p>Type: ${asset.type}</p>
            <p>Quantity: ${asset.quantity}g</p>
            <p>Purchase Price: ${asset.purchasePrice} JOD/g</p>
            <p>Date: ${asset.date}</p>
            <p>Current Value: ${currentValue.toFixed(2)} JOD</p>
            <p>Profit/Loss: <span class="${profitLoss>=0 ? 'profit':'loss'}">${profitLoss.toFixed(2)} JOD</span></p>
          `;
          container.appendChild(div);
        }
      });
    }

    // Search & Filter
    searchInput.addEventListener("input", displayAssets);
    filterSelect.addEventListener("change", displayAssets);

    displayAssets(); // initial load
  </script>
</body>
</html>
