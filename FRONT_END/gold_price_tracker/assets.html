<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
           
            
            background: linear-gradient(135deg, #10375C, #10375C);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color:#10375C;
            font-weight: bold;
}
        
       
       
       
        .one {
            
            width: 90%;
            max-width: 1000px;
            background-color:#F4F6FF ;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
          }

        
        
        .assets-form {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
         }


        .btn {
            grid-column: span 3; 
            background:linear-gradient(140deg, #faf0c9, #d5930f);
            color: #10375C;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1.1rem;
           
           
        }
        .btn:hover{
            background: linear-gradient(135deg, #faf0c9, #d5930f);

        }
        input , select{
            width:100%;
            padding: 15px;
            
            border-radius: 10px;
            border: none;
            color:#10375C;

        }
        .one div{
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height:80px;
        }
        .one_1:before{content:"Type";}
   
        .one_2:before{content:"Category"}
        .one_3:before{content:"Karat"}
        .one_4:before{content:"Date"}
        .one_5:before{content:"Purchase Price"}
        .one_6:before{content:"Weight"}


        .cards{
            width: 90%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
        }
        .card{
            width:100%;
            padding: 15px; 
            color: white; 
            text-align: center;
            border-radius: 10px;
          
           
            border:"solid 1px #EB8317 ";
        
              
        }
    h1 {
    background: linear-gradient(135deg, #faf0c9, #d5930f);
    background-clip: text; /* standard version */
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


        /* عدل حاوية الكروت لتكون مرنة */
.cards {
    width: 90%;
    max-width: 1100px;
    margin: 30px auto;
    background: transparent !important; /* إزالة الخلفية القديمة */
    backdrop-filter: none !important;
    border: none !important;
}

/* تعديل النصوص داخل الكروت لتكون واضحة */
.card-text {
    color: #10375C !important;
}
        

    </style>
</head>
<body>
    <h1>My Assets</h1>
    
    </form>
    
    <div class="one">
        <form class="assets-form">
            <div class="one_1">
                <select class="type">
                    <option>Jewelry</option>
                    <option >Bars</option>
                    <option >Coins</option>
                </select>
             </div>
             <div class="one_2"><select class="category"></select></div>
             <div class="one_3">
                <select class="karat">
                    <option>14K</option>
                    <option>18K</option>
                    <option>21K</option>
                    <option>22K</option>
                    <option>24K</option>
                </select>
            </div>
            <div  class="one_4"> <input type="date" class="pur-date" placeholder="Purchase Date"></div>
            <div  class="one_5"> <input type="number" class="pur-price" placeholder="Purchase Price"></div>
            <div  class="one_6"> <input type="number" class="weight" placeholder="Weight"></div>
            

            <input type="submit" value="Add Assets" class="btn">


        </form>
    </div>
    <div class="cards"></div>
    <script>
       
        const typeSelect=document.querySelector(".type");
        const categorySelect=document.querySelector(".category");
        const karatSelect=document.querySelector(".karat");

        const  purDate=document.querySelector(".pur-date");
        const  purPrice=document.querySelector(".pur-price");
        const  weight=document.querySelector(".weight");


        const form = document.querySelector(".assets-form");
        const  btn=document.querySelector(".btn");

        let cards=document.querySelector(".cards");

        let userAsset = JSON.parse(localStorage.getItem("userAssets")) || [];


        const categories = 
        {
                Jewelry: ["Ring", "Bracelet", "Earrings", "Pendant"],
                Bars:    ["1 kg Bar", "100 g Bar", "Bullion Bar"],
                Coins:   ["Bullion Coin", "Commemorative Coin", "Collector Coin"]
        };
         
        const categoryImages = {
                Jewelry: "gold-jw.jpg",
                Bars: "bars.jpg",
                Coins: "coins.jpg"
};
        fill(typeSelect.value);
        
        typeSelect.addEventListener("change",()=>{
            fill(typeSelect.value);

        });
        function  fill(type){
            categorySelect.innerHTML="";
            console.log(typeSelect.value);
            categories[typeSelect.value].forEach (category =>{
            let option=document.createElement("option");
            option.textContent=category;
            categorySelect.appendChild(option);
            });
        };
        btn.addEventListener("click",function(e){
            
            e.preventDefault();
           
            userAsset.push({
                t:typeSelect.value ,
                c:categorySelect.value,
                d:purDate.value,
                p:purPrice.value,
                w:weight.value,
                k:karatSelect.value,
                i:categoryImages[typeSelect.value],
                id:userAsset.length+1,
                

            });
            localStorage.setItem("userAssets",JSON.stringify(userAsset));
            form.reset();
            fill(typeSelect.value);
            renderCards();

        });
        
          function renderCards() {
    cards.innerHTML = "";
    cards.className = "row g-4 w-100 justify-content-center"; 

    userAsset.forEach((item) => {
        let col = document.createElement("div");
        col.className = "col-12 col-md-6 col-lg-4"; 

        // --- التعديل هنا لتصميم الصورة كـ Cover ---
        col.innerHTML = `
            <div class="card h-100 shadow-sm border-0" style=" border-radius: 15px; overflow: hidden;">
                
                <div style="width: 100%; height: 150px; overflow: hidden;">
                    <img src="${item.i}" class="card-img-top" alt="${item.t}" 
                         style="width: 100%; height: 100%; object-fit: cover;"> </div>

                <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                    <h2 class="card-title h4 mb-3" style="color: #10375C; font-weight: bold;">${item.t}</h2>
                    
                    <div class="card-text text-dark" style="font-weight: 500;">
                        <span class="badge bg-dark mb-2">${item.k}</span> <br>
                        <p class="mb-1"><strong>Category:</strong> ${item.c}</p>
                        <p class="mb-1"><strong>Weight:</strong> ${item.w}g</p>
                        <p class="mb-0"><strong>Price:</strong> $${item.p}</p>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-0 pb-3 text-center">
                     <small class="text-muted" style="font-size: 0.7rem;">ID: #${item.id} | Date: ${item.d}</small>
                </div>
            </div>
        `;

        cards.appendChild(col);
    });
}
           
            renderCards();

           
                    
        



       


       
</script>
       
 
</body>
</html>
