<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Assets | Premium Tracker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        :root {
            --gold: #f3c623;
            --orange: #eb8317;
            --dark-blue: #10375c;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }

        /* 🎥 Header with Video Background */
        .hero-section {
            position: relative;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            background-color: var(--dark-blue); /* Fallback */
            margin-bottom: 40px;
        }

        .bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.4); /* Darkens video so text pops */
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* 🧊 Glassmorphism & UI Elements */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .stat-card {
            border-left: 5px solid var(--orange);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .btn-gold {
            background: linear-gradient(45deg, var(--gold), var(--orange));
            border: none;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(235, 131, 23, 0.4);
            color: white;
        }

        .asset-image-preview {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
            margin-bottom: 15px;
            border: 2px dashed var(--orange);
        }

        .asset-card-img {
            height: 150px;
            background-size: cover;
            background-position: center;
        }

        .sticky-form {
            position: sticky;
            top: 20px;
        }
    </style>
</head>
<body>

<header class="hero-section">
    <video autoplay muted loop playsinline class="bg-video">
        <source src="175992-854481163_medium.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="container hero-content">
        <h1 class="display-4 fw-bold">My Assets Portfolio</h1>
        <p class="lead opacity-75">Securely track your precious metal investments</p>
    </div>
</header>

<div class="container">
    <div class="row g-4">
        
        <div class="col-12 mb-2">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="glass-card p-3 stat-card">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-warning bg-opacity-25 p-3 me-3">
                                <i class="bi bi-cash-stack text-warning fs-4"></i>
                            </div>
                            <div>
                                <small class="text-muted fw-bold text-uppercase">Total Value</small>
                                <h3 id="totalValue" class="mb-0 fw-bold">0 JOD</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card p-3 stat-card">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-info bg-opacity-25 p-3 me-3">
                                <i class="bi bi-tsunami text-info fs-4"></i>
                            </div>
                            <div>
                                <small class="text-muted fw-bold text-uppercase">Total Weight</small>
                                <h3 id="totalWeight" class="mb-0 fw-bold">0g</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="glass-card p-3 stat-card">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-success bg-opacity-25 p-3 me-3">
                                <i class="bi bi-box-seam text-success fs-4"></i>
                            </div>
                            <div>
                                <small class="text-muted fw-bold text-uppercase">Items Count</small>
                                <h3 id="itemCount" class="mb-0 fw-bold">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="glass-card p-4 sticky-form">
                <h4 class="mb-4 fw-bold"><i class="bi bi-plus-lg me-2 text-orange"></i>Add New Asset</h4>
                <form id="assetForm">
                    <img id="preview" class="asset-image-preview" src="#" alt="Preview">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Asset Image</label>
                        <input type="file" class="form-control" id="imgInput" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <select class="form-select" id="type" required>
                            <option value="" disabled selected>Select Type</option>
                            <option>Jewellery</option>
                            <option>Bars</option>
                            <option>Coins</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <select class="form-select" id="category" required>
                            <option value="" disabled selected>Select Category</option>
                            <option>Gold (24K)</option>
                            <option>Gold (21K)</option>
                            <option>Silver</option>
                        </select>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <div class="input-group">
                                <input type="number" class="form-control" id="weight" placeholder="Weight" required step="0.01">
                                <span class="input-group-text">g</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="input-group">
                                <input type="number" class="form-control" id="price" placeholder="Price" required>
                                <span class="input-group-text">JOD</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="date" class="form-control" id="date" required>
                    </div>

                    <button type="submit" class="btn btn-gold w-100 py-2 shadow-sm">ADD TO PORTFOLIO</button>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="row g-3" id="assetsGrid">
                </div>
        </div>

    </div>
</div>

<script>
    const assetForm = document.getElementById('assetForm');
    const assetsGrid = document.getElementById('assetsGrid');
    const imgInput = document.getElementById('imgInput');
    const preview = document.getElementById('preview');

    // Load data from LocalStorage
    let assets = JSON.parse(localStorage.getItem('myAssets')) || [];

    // Image preview logic
    imgInput.onchange = evt => {
        const [file] = imgInput.files;
        if (file) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    };

    function updateDashboard() {
        const totalVal = assets.reduce((sum, item) => sum + parseFloat(item.price || 0), 0);
        const totalW = assets.reduce((sum, item) => sum + parseFloat(item.weight || 0), 0);
        
        document.getElementById('totalValue').innerText = `${totalVal.toLocaleString()} JOD`;
        document.getElementById('totalWeight').innerText = `${totalW.toFixed(2)}g`;
        document.getElementById('itemCount').innerText = assets.length;
    }

    function renderAssets() {
        assetsGrid.innerHTML = '';
        
        if (assets.length === 0) {
            assetsGrid.innerHTML = '<div class="col-12 text-center py-5 text-muted"><h5>No assets added yet.</h5></div>';
        }

        assets.forEach((asset, index) => {
            const card = document.createElement('div');
            card.className = 'col-md-6';
            card.innerHTML = `
                <div class="glass-card p-0 overflow-hidden h-100 border-0 shadow-sm">
                    <div class="asset-card-img" style="background-image: url('${asset.img || 'https://via.placeholder.com/400x200?text=No+Image+Available'}')"></div>
                    <div class="p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h5 class="mb-0 fw-bold text-dark">${asset.type}</h5>
                                <span class="badge bg-warning text-dark mt-1">${asset.category}</span>
                            </div>
                            <button onclick="deleteAsset(${index})" class="btn btn-sm btn-outline-danger border-0">
                                <i class="bi bi-trash3"></i>
                            </button>
                        </div>
                        <div class="row text-center mt-3 border-top pt-3">
                            <div class="col-6 border-end">
                                <small class="text-muted d-block text-uppercase" style="font-size: 0.7rem;">Weight</small>
                                <span class="fw-bold">${asset.weight}g</span>
                            </div>
                            <div class="col-6">
                                <small class="text-muted d-block text-uppercase" style="font-size: 0.7rem;">Value</small>
                                <span class="fw-bold text-success">${asset.price} JOD</span>
                            </div>
                        </div>
                        <div class="mt-3 text-center small text-muted">
                            <i class="bi bi-calendar-event me-1"></i> Added on ${asset.date}
                        </div>
                    </div>
                </div>
            `;
            assetsGrid.appendChild(card);
        });

        updateDashboard();
        localStorage.setItem('myAssets', JSON.stringify(assets));
    }

    assetForm.onsubmit = (e) => {
        e.preventDefault();
        
        const newAsset = {
            type: document.getElementById('type').value,
            category: document.getElementById('category').value,
            weight: document.getElementById('weight').value,
            price: document.getElementById('price').value,
            date: document.getElementById('date').value,
            img: preview.src !== '#' ? preview.src : null
        };

        assets.unshift(newAsset); // Add to the beginning of the array
        renderAssets();
        
        assetForm.reset();
        preview.style.display = 'none';
        preview.src = '#';
    };

    function deleteAsset(index) {
        if(confirm('Are you sure you want to remove this asset?')) {
            assets.splice(index, 1);
            renderAssets();
        }
    }

    // Initial render
    renderAssets();
</script>

</body>
</html>
