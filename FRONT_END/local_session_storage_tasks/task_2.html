<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 50px;
       color:#714a54;
     
    }
    .card{
      width:25%;
      height:50vh;
      background-color:#bd8492 ;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-radius: 50px;;
     

    }
    form{
      margin-top: 50px;;
      width:100%;
      display: flex;
      flex-direction: column;
      justify-content:space-around;
      align-items: center;
      height: 30vh;
    }
    .name, .email {
      display: block;
      height: 5vh;;
      width: 80%;;
      border: none ;
      border-radius:20px ;
       background-color: #a06776;
        
       outline: none;
       padding: 10px;
    }
    
    .btn {
      width:50%;
      height:5vh;
      border-radius: 20px;
      border:none;
      color:#714a54;
      background-color: #a06776;
      font-weight: bolder;
    }
    .name::placeholder,
    .email::placeholder {
      color: #714a54;
      }
      .information{
        display:flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width:80%;
        height:20vh;

      }
    
  </style>
</head>
<body>
    <div class="card">
      <h1>Store Object</h1>
        <form action="" class="info">
          <input type="text" class="name" placeholder="write name here">
          <input type="text" class="email" placeholder="write email here">
          <input type="submit" class="btn">
        </form>
    <div class="information"></div>

    </div>

    <script>
      let btn=document.querySelector(".btn");
      let name=document.querySelector(".name");
      let email=document.querySelector(".email");
      let myDiv=document.querySelector(".information");
      let obj={};

      let data ;
      let p_one= document.createElement("p");
      let p_two=document.createElement("p");

      if (localStorage.getItem("info")){
          data=JSON.parse(localStorage.getItem("info"));
        
           p_one.textContent=`Name:  ${data["n"]}`;
           p_two.textContent=`Email: ${data["e"]}`;

           myDiv.appendChild(p_one);
           myDiv.appendChild(p_two);


      }

      btn.addEventListener("click", ()=>{
         if (name.value !=="" && email.value !=="" ){
            console.log(name.value +"\n"+ email.value);
            obj={n:name.value , e:email.value};
           
            localStorage.setItem("info", JSON.stringify(obj));
           data=JSON.parse(localStorage.getItem("info"));

           p_one.textContent=`Name:  ${data["n"]}`;
           p_two.textContent=`Email: ${data["e"]}`;

           myDiv.appendChild(p_one);
           myDiv.appendChild(p_two);
            

         };
      });



    </script>

  

  


</body>
</html>
