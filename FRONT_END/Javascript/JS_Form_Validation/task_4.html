<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        .card{
            display:flex;
            flex-direction: column;
            width: 50%;
            background-color: brown;
            height: 80vh;
            
            align-items: center;
            justify-content: space-between;
        }
        form{
            display: flex;
            flex-direction: column;
            width: 80%;
            height: 76vh;
            justify-content: space-around;
            background-color: aquamarine;

        }
        .name{
            display: flex;
            flex-direction: row;
            
            background-color: blue;
            justify-content: space-between;
            
        }
        .name div{
            width:47%;
            display: flex;
          
           
        }
        form div{
             display: flex;
            flex-direction: column;
            gap: 5px;;

        }
        .btn{
            width: 50%;
            margin:0px auto;
            border-radius: 50px;
            height: 5vh;
            border: none;
            color: white;
            background-color: #1e81b0;
        }
        .header{
            background-color: blueviolet;
            width: 100%;
            margin: auto;
            text-align: center;
        }
        
       

       
    </style>
</head>
<body>
    <div class="card">
        <h1 class="header">Registration Form</h1>
        <div></div>
        <form action="">
            <div class="name">
                <div class="Fname">
                    <label>Fisrt Name</label>
                    <input type="text"  class="FnameInput">
                    
                </div>
                <div class="Lname">
                    <label>Last Name</label>
                    <input type="text"  class="LnameInput">
                    
                </div>
            </div>
            <div class="date">
                <label>Date of Birth</label>
                <input type="date" class="dateInput">
            </div>
            <div class="email">
                <label>Email Address</label>
                <input type="text"  class="emailInput">
                <input type="text" placeholder="Confirm Email" class="emailInputConf">

            </div>
            <div class="pass">
                <label>Password</label>
                <input type="password" class="passInput">
            </div>
            <div class="confPass">
                <label>Confirm Password</label>
                <input type="password" class="passInputConf">
            </div>
            <input type="submit" value="Register" class="btn">

        </form>
    </div>
    <script>
        //naming ruleeeeees 
       let Fname=document.getElementsByClassName("Fname")[0];
       let Lname=document.getElementsByClassName("Lname")[0];

        let FnameInp=document.getElementsByClassName("FnameInput")[0];
        let LnameInp=document.getElementsByClassName("LnameInput")[0];
        let btn=document.getElementsByClassName("btn")[0];

        let Fnamevalid=false;
        let Lnamevalid=false;

        let nameRegex=/^[a-zA-Z]+$/;
        
        
        FnameInp.addEventListener("focus",function(){
            
            // if(nameRegex.test(FnameInp.value)){
            //     console.log("valid");
            // }
        });
        FnameInp.addEventListener("blur",function(){
        
            if (!nameRegex.test(FnameInp.value) ){
                if (Fname.lastElementChild.tagName !=="P"){
                    let FnameP=document.createElement("p");
                    FnameP.textContent="Letters Only";
                    Fname.appendChild(FnameP);
                    FnameP.style.color="red";
                }
            }
                else{
                
                if (Fname.lastElementChild.tagName==="P"){
                    Fname.lastElementChild.remove();
                    }
                 }
                

        });
        LnameInp.addEventListener("blur",function(){
        
            if (!nameRegex.test(LnameInp.value) ){
                if (Lname.lastElementChild.tagName !=="P"){
                    let LnameP=document.createElement("p");
                    LnameP.textContent="Letters Only";
                    Lname.appendChild(LnameP);
                    LnameP.style.color="red";
                }
            }
                else{
                
                if (Lname.lastElementChild.tagName==="P"){
                    Lname.lastElementChild.remove();
                    }
                 }
                

        });

    </script>
</body>
</html>
