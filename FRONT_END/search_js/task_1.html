<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .card{
            width: 25% !important;
            color:#721825 !important;
            font-weight: bold !important;
            background-color: #e3b23f;
            
        }
        .btn{
            background-color: #d9cfbf !important;
              color:#721825 !important;
            font-weight: bold !important;
            outline: none !important;
            border: none ;
        }
    </style>
</head>

<body>
    <div class="card" style="width: 18rem;">
        <img class="card-img-top" src="Fruits.jpg" alt="Card image cap">
        <div class="card-body">
            <h5 class="card-title">Fruits Search</h5>
            <p class="card-text">Please Enter The Fruits You Search For </p>
            <input type="text" class="form-control" placeholder="Search Fruits">
            
        </div>
    </div>
    <script>
        
        let fruits=["apple", "banana", "orange", "grape"];
        let inp=document.querySelector("input");

        inp.addEventListener("keyup", function (){
        
         let newArr=fruits.filter (el => el.includes(inp.value.toLocaleLowerCase().trim()));
         console.log(newArr);


       });
       





    </script>
</body>
</html>
