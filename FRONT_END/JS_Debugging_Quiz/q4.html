<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var arr= [5,10,15]
        var result= []

        for (var i=0;i<arr.length;i++) {
        var val=arr[i]

        switch (true) {
        case val>10:
        result[result.length]=val*2
        break
        case val>5:
        result[result.length]=val+5
        break
        default:
        result[result.length]=val-1
        }
        }

        console.log(result)
    </script>
</body>
</html>
